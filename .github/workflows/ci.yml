name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissao minima: apenas leitura do repositorio.
permissions:
  contents: read

jobs:
  # Testes e lint do backend em duas versoes de Python.
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes
        working-directory: backend
        run: python -m pytest -q

      - name: Verificar estilo com Ruff
        working-directory: backend
        run: python -m ruff check app importador tests

  # Garante que o arquivo do Docker Compose e valido e resolvel.
  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Criar .env a partir do exemplo
        run: cp .env.example .env

      - name: Validar docker compose config
        run: docker compose config --quiet
