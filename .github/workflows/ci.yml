name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff (estilo)
        run: python -m ruff check .

      - name: Pytest (suíte offline)
        working-directory: backend
        run: python -m pytest -q

  artefatos:
    name: Validação dos artefatos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar validadores
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Sintaxe do front-end
        run: node --check frontend/js/app.js

      - name: Validar JSON e YAML
        run: |
          python -c "import json, pathlib; json.loads(pathlib.Path('vercel.json').read_text())"
          python -c "import yaml, pathlib; [yaml.safe_load(pathlib.Path(p).read_text()) for p in ['docker-compose.yml', 'render.yaml', '.github/workflows/ci.yml', '.github/dependabot.yml']]"

      - name: Validar Dockerfile e Compose
        run: |
          docker compose config -q
          docker build -f backend/Dockerfile -t juris-lab:ci .
