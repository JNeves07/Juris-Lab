# Juris-Lab — orquestração da API.
# Padrão: sobe sozinha com SQLite + dados de exemplo (`docker compose up -d --build`).
# Opcional: PostgreSQL/pgvector com `docker compose --profile postgres up -d --build`.

services:
  # ---------------------------------------------------------------------
  # API FastAPI: serve /api, /api/docs, /healthz e o front-end em / e /static.
  # Funciona isolada, sem nenhum outro serviço.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: juris_api
    restart: unless-stopped

    environment:
      JLS_MODE: ${JLS_MODE:-sqlite}
      JLS_DB_PATH: ${JLS_DB_PATH:-/app/data/jurislab.sqlite3}
      JLS_SEED: ${JLS_SEED:-1}
      JLS_JWT_SECRET: ${JLS_JWT_SECRET:-dev-only-jurislab-change-me-in-production}
      JLS_ADMIN_PASSWORD: ${JLS_ADMIN_PASSWORD:-admin}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_DIR: /app/frontend

    ports:
      - "8000:8000"

    volumes:
      - sqlite_data:/app/data

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------
  # PostgreSQL + pgvector (opcional). Ative com o profile `postgres`.
  # ---------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: juris_db
    restart: unless-stopped
    profiles: ["postgres"]

    environment:
      POSTGRES_USER: juris
      POSTGRES_PASSWORD: ${DB_PASSWORD:-juris_dev}
      POSTGRES_DB: jurisprudencia

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c effective_cache_size=6GB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juris -d jurisprudencia"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-postgres:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: juris_api_postgres
    restart: unless-stopped
    profiles: ["postgres"]

    environment:
      JLS_MODE: postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://juris:juris_dev@db:5432/jurisprudencia}
      JLS_JWT_SECRET: ${JLS_JWT_SECRET:-dev-only-jurislab-change-me-in-production}
      JLS_ADMIN_PASSWORD: ${JLS_ADMIN_PASSWORD:-admin}
      FRONTEND_DIR: /app/frontend

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8001:8000"

    volumes:
      - ./frontend:/app/frontend:ro
      - ./dados:/app/dados:ro

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  sqlite_data:
